<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Půjde Země Ňuňísků na téhle konzoli?</title>
<style>
  :root{ --zelena:#3f9e52; --cervena:#d8544a; --zluta:#e0a13a; }
  *{box-sizing:border-box}
  body{margin:0;padding:4vh 4vw;background:#2b2118;color:#f3e6d2;
       font:18px/1.55 system-ui,"Segoe UI",sans-serif}
  h1{font-size:30px;margin:0 0 6px}
  p.pod{margin:0 0 22px;opacity:.8}
  #verdikt{border-radius:14px;padding:18px 20px;margin:0 0 24px;font-size:20px;
           background:#3a2d20;border:2px solid #6b5334}
  #verdikt b{font-size:24px;display:block;margin-bottom:6px}
  table{border-collapse:collapse;width:100%;max-width:900px}
  td{padding:9px 10px;border-bottom:1px solid #4a3a28;vertical-align:top}
  td.stav{width:130px;font-weight:700;white-space:nowrap}
  .ok{color:var(--zelena)} .zle{color:var(--cervena)} .snad{color:var(--zluta)}
  small{opacity:.72;display:block;font-size:15px}
  a{color:#ffd47a}
  .tlac{display:inline-block;margin-top:26px;padding:14px 22px;border-radius:12px;
        background:#4b7a3a;color:#fff;text-decoration:none;font-weight:700;font-size:20px}
</style>
</head>
<body>
<h1>Půjde Země Ňuňísků na téhle konzoli?</h1>
<p class="pod">Otevři tuhle stránku v prohlížeči na Xboxu (nebo kdekoli jinde)
a ona sama vyzkouší, co je potřeba. Trvá to pár vteřin.</p>

<div id="verdikt"><b>Zkouším…</b>Vydrž chviličku.</div>
<table id="tab"></table>
<a class="tlac" href="./">▶ Spustit hru</a>
<a class="tlac" style="background:#5b4a33" href="novinky.html">Co je nového</a>

<script>
const tab = document.getElementById("tab");
function radek(co, stav, text, pozn){
  const tr = document.createElement("tr");
  const t = {ok:["ok","✔ funguje"], zle:["zle","✖ nefunguje"], snad:["snad","● asi ano"]}[stav];
  tr.innerHTML = '<td class="stav ' + t[0] + '">' + t[1] + '</td>'
               + '<td><b>' + co + '</b><small>' + text + (pozn ? " " + pozn : "") + '</small></td>';
  tab.appendChild(tr);
  return stav;
}

const vysledky = {};
function zapis(klic, co, stav, text, pozn){ vysledky[klic] = radek(co, stav, text, pozn); }

/* --- 1) co je to za prohlížeč --- */
(function(){
  const ua = navigator.userAgent;
  const xbox = /Xbox/i.test(ua);
  const chromium = /Chrome|Edg/i.test(ua);
  zapis("prohlizec", "Prohlížeč",
    chromium ? "ok" : "snad",
    (xbox ? "Jsi na Xboxu. " : "") + (chromium ? "Je to Chromium (Edge/Chrome), což hra potřebuje." : "Neznámý prohlížeč – hra možná pojede, možná ne."),
    "<br>" + ua);
})();

/* --- 2) velikost obrazu --- */
(function(){
  const w = window.innerWidth, h = window.innerHeight;
  zapis("obraz", "Velikost obrazu", w >= 900 ? "ok" : "snad",
    w + " × " + h + " bodů." + (w >= 900 ? " To hře stačí." : " Dost malé, panel se může mačkat."));
})();

/* --- 3) ukládání jména a nastavení --- */
(function(){
  let ok = false;
  try{ localStorage.setItem("nun_test","1"); ok = localStorage.getItem("nun_test")==="1"; localStorage.removeItem("nun_test"); }catch(e){}
  zapis("ulozeni", "Zapamatování jména a ikonky", ok ? "ok" : "snad",
    ok ? "Jméno a ikonka se uloží." : "Nepůjde uložit jméno – hra půjde hrát, jen se bude ptát pokaždé.");
})();

/* --- 4) ovladač --- */
(function(){
  const je = !!navigator.getGamepads;
  zapis("ovladac", "Ovládání ovladačem", je ? "ok" : "snad",
    je ? "Hra rozumí ovladači: levá páčka kurzor, A vybrat, B poslat, pravá páčka rozhlížení."
       : "Ovladač prohlížeč nehlásí. Připoj myš a klávesnici – ty na Xboxu fungují.");
})();

/* --- 5) rychlost kreslení --- */
function testRychlosti(){
  return new Promise(hotovo => {
    const vrstva = document.createElement("div");
    vrstva.style.cssText = "position:fixed;left:-9999px;top:0;width:600px;height:400px";
    document.body.appendChild(vrstva);
    for(let i = 0; i < 300; i++){
      const d = document.createElement("div");
      d.innerHTML = '<svg width="40" height="40"><circle cx="20" cy="20" r="16" fill="#c86"/>'
                  + '<circle cx="14" cy="16" r="4" fill="#fff"/><circle cx="26" cy="16" r="4" fill="#fff"/></svg>';
      d.style.cssText = "position:absolute;will-change:transform";
      vrstva.appendChild(d);
    }
    const deti = vrstva.children;
    let n = 0, t0 = performance.now(), casy = [];
    function snimek(t){
      for(let i = 0; i < deti.length; i++)
        deti[i].style.transform = "translate(" + ((i*7+n*3)%560) + "px," + ((i*11)%360) + "px)";
      casy.push(t - t0); t0 = t;
      if(++n < 45) requestAnimationFrame(snimek);
      else{
        vrstva.remove();
        casy.sort((a,b)=>a-b);
        hotovo(casy[Math.floor(casy.length/2)]);
      }
    }
    requestAnimationFrame(t => { t0 = t; requestAnimationFrame(snimek); });
  });
}

/* --- 6) spojení s kamarádem (to hlavní) --- */
function testWebRTC(){
  return new Promise(hotovo => {
    if(!window.RTCPeerConnection) return hotovo({stav:"zle", text:"Prohlížeč neumí WebRTC – hra pro víc lidí tady nepůjde."});
    let pc;
    try{
      pc = new RTCPeerConnection({iceServers:[
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"}
      ]});
    }catch(e){ return hotovo({stav:"zle", text:"WebRTC se nepodařilo spustit: " + e.message}); }

    let kanalOk = false, host = 0, srflx = 0, relay = 0;
    try{ const k = pc.createDataChannel("test"); kanalOk = !!k; }catch(e){}

    pc.onicecandidate = ev => {
      const c = ev.candidate && ev.candidate.candidate || "";
      if(/ typ relay/.test(c)) relay++;
      else if(/ typ srflx/.test(c)) srflx++;
      else if(/ typ host/.test(c)) host++;
    };
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(()=>{});

    setTimeout(() => {
      try{ pc.close(); }catch(e){}
      const cesty = "Adresy: " + host + " místních, " + srflx + " veřejných, " + relay + " přeposílacích.";
      if(!kanalOk) return hotovo({stav:"zle", text:"Nejde vyrobit datový kanál. " + cesty});
      if(srflx || relay) hotovo({stav:"ok", text:"Konzole se umí ohlásit do internetu, takže spojení s kamarádem by mělo jít. " + cesty});
      else if(host) hotovo({stav:"snad", text:"Zjistila se jen místní adresa. Půjde to nejspíš jen na stejné síti (doma ano), přes internet možná ne. " + cesty});
      else hotovo({stav:"zle", text:"Nezjistila se žádná adresa – síť něco blokuje. " + cesty});
    }, 6000);
  });
}

/* --- 7) signalizační server (jak se hráči najdou podle kódu) --- */
function testWebSocket(){
  return new Promise(hotovo => {
    if(!window.WebSocket) return hotovo({stav:"zle", text:"Prohlížeč neumí WebSocket – kód hry se nespáruje."});
    let ws, hotovoUz = false;
    const dokonci = (stav, text) => { if(hotovoUz) return; hotovoUz = true; try{ ws && ws.close(); }catch(e){} hotovo({stav, text}); };
    try{ ws = new WebSocket("wss://0.peerjs.com/peerjs?key=peerjs&id=nuntest" + Math.floor(Math.random()*1e9) + "&token=t"); }
    catch(e){ return dokonci("zle", "Nešlo se připojit: " + e.message); }
    ws.onopen  = () => dokonci("ok", "Server, přes který se hráči najdou podle kódu, odpovídá.");
    ws.onerror = () => dokonci("zle", "Server pro párování kódů neodpovídá – hra pro víc lidí by se nespojila.");
    setTimeout(() => dokonci("snad", "Server odpověděl pomalu. Zkus to znovu, může to být chvilkový výpadek."), 8000);
  });
}

/* --- poskládat verdikt --- */
Promise.all([testRychlosti(), testWebRTC(), testWebSocket()]).then(([ms, rtc, ws]) => {
  const fps = Math.round(1000 / Math.max(1, ms));
  zapis("rychlost", "Rychlost kreslení",
    fps >= 40 ? "ok" : (fps >= 18 ? "snad" : "zle"),
    "Zvládne asi " + fps + " obrázků za vteřinu se třemi stovkami panáčků. "
    + (fps >= 40 ? "To je plynulé." : fps >= 18 ? "Půjde to hrát, ve velké bitvě to může cukat." : "Bude to hodně pomalé – hraj na menší mapě a s méně panáčky."));
  zapis("rtc", "Spojení s kamarádem", rtc.stav, rtc.text);
  zapis("ws", "Hledání hry podle kódu", ws.stav, ws.text);

  const v = document.getElementById("verdikt");
  const sam = vysledky.prohlizec !== "zle" && vysledky.rychlost !== "zle";
  const spolu = rtc.stav === "ok" && ws.stav === "ok";
  if(sam && spolu){
    v.style.borderColor = "#3f9e52";
    v.innerHTML = "<b>✔ Jde všechno</b>Hru si tady zahraješ sám i s kamarádem přes internet. "
                + "Nejlíp se to ovládá myší a klávesnicí, ale ovladač funguje taky.";
  }else if(sam){
    v.style.borderColor = "#e0a13a";
    v.innerHTML = "<b>● Hra pojede, spojení není jisté</b>Sám si zahraješ. "
                + "U hraní s kamarádem něco vázlo – podrobnosti jsou v tabulce. "
                + "Zkus to znovu, nebo ať hru zakládá ten druhý.";
  }else{
    v.style.borderColor = "#d8544a";
    v.innerHTML = "<b>✖ Tady to asi drhne</b>Podívej se do tabulky, co selhalo. "
                + "Hru zkus i tak – nemusí to znamenat, že vůbec nepojede.";
  }
});
</script>
</body>
</html>
